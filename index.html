 else if(MATS[id]){const m=MATS[id];r={n:m.n,ic:m.ic,k:'mat',v:m.v,c:m.c};}

 return IC[id]=r;}

function mk(t,x,y,d){const o={t,x,y};
 if(t==='bench'||t==='zer'){o.inq=[];o.out=[];o.job=null;o.jt=0;o.jd=0;}
 else if(t==='fab'){o.rec='p_lamp';o.mats={};o.out=[];o.job=null;o.jt=0;o.jd=0;}
 else if(t==='counter'){o.stock={};}
 else if(t==='lager'){o.store={};o.filter=null;o.et=0;}
 else if(t==='conv'){o.d=d||0;o.item=null;o.prog=0;}
 return o;}

(function genDeco(){

 if(o.out){for(let i=o.out.length-1;i>=0&&got<n;i--)if(o.out[i]===id){o.out.splice(i,1);got++;}}
 else{const m=o.t==='counter'?o.stock:o.store;got=Math.min(n,m[id]||0);m[id]-=got;if(m[id]<=0)delete m[id];}
 return got;}
function facing(c,o){return c.t==='conv'&&c.x+D4[c.d][0]===o.x&&c.y+D4[c.d][1]===o.y;}
function flush(o,id){for(const[dx,dy]of D4){const c=S.objs[(o.x+dx)+','+(o.y+dy)];if(c&&c.t==='conv'&&!c.item&&!facing(c,o)){c.item=id;c.prog=0;return true;}}return false;}
function spark(o,col){parts.push({x:(o.x-o.y)*16+rnd(-4,4),y:(o.x+o.y)*8+4-rnd(8,14),vx:rnd(-20,20),vy:rnd(-40,-10),l:.4,c:col||'#ffd84a'});}

    if(t){if(t.t==='conv'){if(!t.item){t.item=o.item;t.prog=0;o.item=null;}}
     else if(room(t,o.item)>0){give(t,o.item,1);o.item=null;}}}
  }}}

function findPath(sx,sy,goal){
 const W=MW,H=MH,prev=new Int16Array(W*H).fill(-2),q=[sy*W+sx];prev[sy*W+sx]=-1;
 if(goal(sx,sy))return[];
 for(let i=0;i<q.length;i++){const c=q[i],cx=c%W,cy=(c/W)|0;
  for(const[dx,dy]of D4){const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(prev[n]!==-2||blocked(nx,ny))continue;prev[n]=c;
   if(goal(nx,ny)){const p=[];let k=n;while(k!==-1){p.push({x:k%W+.5,y:((k/W)|0)+.5});k=prev[k];}p.pop();return p.reverse();}
   q.push(n);}}
 return null;}
function pathAdj(w,o){return findPath(Math.floor(w.x),Math.floor(w.y),(x,y)=>Math.abs(x-o.x)+Math.abs(y-o.y)===1);}
function walk(w,dt,spd){
 if(!w.path||!w.path.length){w.mv=false;return false;}
 const t=w.path[0],dx=t.x-w.x,dy=t.y-w.y,d=Math.hypot(dx,dy),st=spd*dt;
 if(d<=st){w.x=t.x;w.y=t.y;w.path.shift();}else{w.x+=dx/d*st;w.y+=dy/d*st;}
 w.vx=dx/(d||1);w.vy=dy/(d||1);w.mv=true;w.ph=(w.ph||0)+dt*11;return true;}
function lagers(){return Object.values(S.objs).filter(o=>o.t==='lager');}
function spawnSpot(){const r=rect();let best=null;
 const p=findPath(r.x+r.w-1,r.y+r.h-1,(x,y)=>!blocked(x,y)&&!S.objs[x+','+y]);return p&&p.length?{x:Math.floor(p[0].x),y:Math.floor(p[0].y)}:{x:r.x+r.w-1,y:r.y+r.h};}

function findDest(id,src){const k=info(id).k;
 if(k==='fixed'||k==='prod'){for(const o of Object.values(S.objs))if(o.t==='counter'&&room(o,id)>0)return o;}
 if(k==='mat'){for(const o of Object.values(S.objs))if(o!==src&&o.t==='fab'&&room(o,id)>0&&!claimed.has(o.x+','+o.y))return o;}
 for(const o of lagers())if(room(o,id)>0)return o;return null;}
function planTech(){
 const objs=Object.values(S.objs);
 for(const o of objs){if(!o.out||!o.out.length||claimed.has(o.x+','+o.y))continue;
  for(const id of new Set(o.out)){const d=findDest(id,o);if(d){const c=o.out.filter(z=>z===id).length;return{src:o,dst:d,id,n:Math.min(c,4,room(d,id)),ck:o.x+','+o.y};}}}
 const L=lagers();if(!L.length)return null;
 const matTot=L.reduce((a,l)=>a+Object.keys(l.store).filter(i=>MATS[i]).reduce((b,i)=>b+l.store[i],0),0);
 for(const o of objs){if(claimed.has(o.x+','+o.y))continue;
  if(o.t==='bench'||o.t==='zer'||o.t==='fab'){
   if(o.t==='zer'&&matTot>=14)continue;
   for(const l of L)for(const id in l.store){if(l.store[id]>0&&room(o,id)>0&&(o.t==='fab'||info(id).k==='broken')){return{src:l,dst:o,id,n:Math.min(l.store[id],room(o,id),4),ck:o.x+','+o.y};}}}}
 return null;}
function techAI(w){
 if(!w.st||w.st==='idle'){const t=planTech();if(!t){w.wait=1;return;}
  const p=pathAdj(w,t.src);if(!p){w.wait=1;return;}
  w.task=t;claimed.add(t.ck);w.path=p;w.st='src';}
 else if(w.st==='src'){const t=w.task,got=takeFrom(t.src,t.id,t.n);
  if(!got){claimed.delete(t.ck);w.st='idle';w.task=null;return;}
  w.carry={id:t.id,n:got};const p=pathAdj(w,t.dst);
  if(!p){claimed.delete(t.ck);giveBack(w);w.st='idle';return;}
  w.path=p;w.st='dst';}
 else if(w.st==='dst'){const t=w.task,c=w.carry;
  const n=Math.min(c.n,Math.max(0,room(t.dst,c.id)));if(n>0){give(t.dst,c.id,n);c.n-=n;}
  if(c.n>0)giveBack(w);
  w.carry=null;claimed.delete(t.ck);w.task=null;w.st='idle';w.wait=.4;}}
function giveBack(w){const c=w.carry;if(c&&c.n>0){for(const l of lagers()){const n=Math.min(c.n,room(l,c.id));if(n>0){give(l,c.id,n);c.n-=n;}}}w.carry=null;}
function buyAI(w){
 if(!w.st||w.st==='idle'){const L=lagers().filter(l=>room(l,'metal')>3);if(!L.length){w.wait=2;return;}
  let best=null;S.stock.forEach((st,i)=>{if(STALLS[i].trader)return;st.forEach(it=>{if(it.s>0&&it.p<=S.money-15){const r=BROKEN[it.id].val/it.p;if(!best||r>best.r)best={r,i,it};}});});
  if(!best){w.wait=3;return;}
  const sp=STALLS[best.i],p=pathAdj(w,sp);if(!p){w.wait=2;return;}
  w.target=best;w.path=p;w.st='buy';}
 else if(w.st==='buy'){const b=w.target,it=b.it;
  const n=Math.min(it.s,3,Math.floor((S.money-15)/it.p));
  if(n>0){it.s-=n;S.money-=it.p*n;w.carry={id:it.id,n};}
  const L=lagers().filter(l=>room(l,'metal')>0);
  if(!w.carry||!L.length){w.carry=null;w.st='idle';w.wait=2;return;}
  const p=pathAdj(w,L[0]);if(!p){w.carry=null;w.st='idle';return;}w.dst=L[0];w.path=p;w.st='drop';}
 else if(w.st==='drop'){const c=w.carry,l=w.dst;if(c&&S.objs[l.x+','+l.y]){const n=Math.min(c.n,room(l,c.id));if(n>0)give(l,c.id,n);}
  w.carry=null;w.st='idle';w.wait=1;}}
function updWorker(w,dt){w.wait=(w.wait||0)-dt;if(walk(w,dt,2.4))return;if(w.wait>0)return;if(w.kind==='tech')techAI(w);else buyAI(w);}

    c.st='out';c.path=findPath(Math.floor(c.x),Math.floor(c.y),(x,y)=>x>=MW-1)||[{x:MW-.5,y:19.5}];}}
  else if(c.st==='out')custs.splice(i,1);}}

 take(p){const[k,id,n]=p.split('|');const o=S.objs[k];if(!o)return;const m=Math.min(+n,S.cap-invCount());if(m<=0){toast('Rucksack voll!');return;}const g=takeFrom(o,id,m);if(g>0){addInv(id,g);beep(440,.05);}},

 buy(p){const[i,id,n]=p.split('|');const it=S.stock[+i].find(x=>x.id===id);let m=Math.min(+n,it.s,Math.floor(S.money/it.p),S.cap-invCount());

  S.money-=m*it.p;it.s-=m;addInv(id,m);beep(330,.07);},
 msell(p){const[m,n]=p.split('|');const k=Math.min(+n,S.inv[m]||0);if(!k)return;const pr=Math.max(1,Math.floor(MATS[m].v*.8*S.tf));S.money+=k*pr;S.earned+=k*pr;decInv(m,k);beep(700,.08);},

function doAct(){if(modal){return;}const t=nearest();if(!t){toast('Hier gibt es nichts zu tun');return;}openTarget(t);}
function openTarget(t){
 if(t.kind==='stall'){openModal('🏪 '+STALLS[t.i].n,stallPanel(t.i));return;}
 const o=t.o,key=o.x+','+o.y;
 const f={bench:machinePanel,zer:machinePanel,fab:machinePanel,counter:counterPanel,lager:lagerPanel}[o.t];
 openModal({bench:'🛠️ ',zer:'⚙️ ',fab:'🏭 ',counter:'🛒 ',lager:'📦 '}[o.t]+MNAME[o.t],f(key));}
function nearest(px,py){if(IN){const rm=roomOf(IN);if(rm.desk&&Math.hypot(rm.desk.x-P.x,rm.desk.y-P.y)<2.4)return{kind:'stall',i:IN.i,label:STALLS[IN.i].n};return null;}px=px??P.x;py=py??P.y;let best=null,bd=2.3;
 for(const o of Object.values(S.objs)){if(o.t==='conv')continue;const d=Math.hypot(o.x+.5-px,o.y+.5-py);if(d<bd){bd=d;best={kind:'obj',o,label:MNAME[o.t]};}}
 STALLS.forEach((s,i)=>{const d=Math.hypot(s.x+.5-px,s.y+.5-py);if(d<bd){bd=d;best={kind:'stall',i,label:s.n};}});return best;}

let buildMode=false,tool='conv',rot=0,cur=null,bdown=false,blast=null;
function updBar(){if(!buildMode)return;const h=TOOLS.map(t=>`<button data-a="tool" data-p="${t.id}" class="${tool===t.id?'sel':''} ${t.lv&&t.lv>S.level?'dis':''}"><b>${t.ic}</b>${t.n}<br>${t.lv&&t.lv>S.level?'🔒 '+LV[t.lv].n:t.c?t.c+'€':'+50%'}</button>`).join('')+`<button data-a="rot"><b>${ARW[rot]}</b>Drehen</button><button data-a="build"><b>✔</b>Fertig</button>`;
 if(h!==$('bar')._h){$('bar').innerHTML=h;$('bar')._h=h;}}
function place(x,y){
 if(tool==='erase'){const o=S.objs[x+','+y];if(!o)return;S.money+=Math.floor((o.cost||(({bench:120,zer:220,fab:450,counter:90,lager:100,conv:8})[o.t]||0))/2);
  ['inq','out'].forEach(f=>{if(o[f])o[f].forEach(i=>{if(invCount()<S.cap&&!f.startsWith('x'))addInv(i,1);});});
  ['stock','store','mats'].forEach(f=>{if(o[f])for(const i in o[f])for(let n=0;n<o[f][i];n++)if(invCount()<S.cap)addInv(i,1);});
  delete S.objs[x+','+y];beep(200,.1);return;}
 if(!inShop(x,y)){toast('Nur innerhalb der Werkstatt bauen!');return;}
 const k=x+','+y,ex=S.objs[k];
 if(ex){if(tool==='conv'&&ex.t==='conv'){ex.d=rot;return;}toast('Feld ist belegt');return;}
 const t=TOOLS.find(z=>z.id===tool);if(t.lv&&t.lv>S.level){toast('Erst ausbauen!');return;}if(S.money<t.c){toast('Zu wenig Geld!');return;}
 if(tool!=='conv'&&Math.floor(P.x)===x&&Math.floor(P.y)===y){toast('Du stehst im Weg');return;}
 S.money-=t.c;{const o=mk(t.t||tool,x,y,rot);if(t.sp)o.sp=t.sp;if(t.cap)o.cap=t.cap;o.cost=t.c;S.objs[k]=o;}beep(400,.06);}
function tileAt(e,off){const rc=cv.getBoundingClientRect();const sx=(e.clientX-rc.left)/PS-ox,sy=(e.clientY-rc.top)/PS-oy+(off||0);return{x:Math.floor((sx/16+sy/8)/2),y:Math.floor((sy/8-sx/16)/2)};}
const cv=$('c'),ctx=cv.getContext('2d'),tc=$('tc'),tctx=tc.getContext('2d');let PS=1,VW=480,VH=220,ox=0,oy=0;
cv.addEventListener('pointerdown',e=>{if(modal||IN)return;const t=tileAt(e);
 if(buildMode){bdown=true;blast=t;cur=t;place(t.x,t.y);}
 else{let tt=tileAt(e,8),k=tt.x+','+tt.y,found=null;
  if(S.objs[k]&&S.objs[k].t!=='conv'||stallAt[k]!==undefined){found=tt;}else{k=t.x+','+t.y;if(S.objs[k]&&S.objs[k].t!=='conv'||stallAt[k]!==undefined)found=t;}
  if(found){const k2=found.x+','+found.y;const tg=stallAt[k2]!==undefined?{kind:'stall',i:stallAt[k2]}:{kind:'obj',o:S.objs[k2]};
   const cx=found.x+.5,cy=found.y+.5;if(Math.hypot(cx-P.x,cy-P.y)<=2.6)openTarget(tg);else toast('Zu weit weg – geh näher heran');}}});
cv.addEventListener('pointermove',e=>{if(!buildMode||IN)return;const t=tileAt(e);cur=t;
 if(bdown&&tool==='conv'&&blast&&(t.x!==blast.x||t.y!==blast.y)){
  const dx=t.x-blast.x,dy=t.y-blast.y;if(Math.abs(dx)+Math.abs(dy)===1){const d=D4.findIndex(a=>a[0]===dx&&a[1]===dy);const lo=S.objs[blast.x+','+blast.y];if(lo&&lo.t==='conv')lo.d=d;rot=d;}
  place(t.x,t.y);blast=t;}});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{bdown=false;blast=null;}));

const ROOMS={};
function mkRand(seed){return()=>(seed=(seed*1103515245+12345)&0x7fffffff)/0x7fffffff;}
function roomOf(q){const k=q.kind+q.i;return ROOMS[k]||(ROOMS[k]=q.kind==='h'?buildHouse(q.i):buildShop(q.i));}
function buildHouse(i){const b=HOUSES[i],r=mkRand(31+i*977);
 const rw=Math.max(5,b.w),rh=Math.max(4,b.h+1),ex=Math.floor(rw/2),items=[],sol={};
 const free=(x,y)=>!sol[x+','+y]&&!(x===ex&&y>=rh-2);
 const put=(t,x,y)=>{if(x<0||y<0||x>=rw||y>=rh||!free(x,y))return false;items.push({t,x,y,k:items.length});sol[x+','+y]=1;return true;};
 const back=['bed','shelf','kitchen','fridge','tv','wardrobe','plant'].sort(()=>r()-.5);
 let k=0;for(let x=0;x<rw;x++){if(r()<.78)put(back[k++%back.length],x,0);}
 const side=['plant','sofa','lamp','shelf'].sort(()=>r()-.5);
 for(let y=1;y<rh-1;y++){if(r()<.6)put(side[(y-1)%side.length],0,y);}
 const ty=Math.min(rh-3,Math.max(1,Math.floor(rh/2)));put('table',Math.min(rw-2,ex+1),ty);
 put('plant',rw-1,rh-1);
 let npc=null;for(const[x,y]of[[rw-2,rh-2],[ex-1,rh-3],[rw-1,ty],[1,1],[ex+1,1]]){if(x>=0&&y>=0&&x<rw&&y<rh&&free(x,y)){npc={x:x+.5,y:y+.5,pal:HPAL[i%HPAL.length],line:HLINE[i%HLINE.length]};sol[x+','+y]=1;break;}}
 const rug={x0:Math.max(1,ex-1),y0:Math.max(1,ty-1),x1:Math.min(rw-1,ex+1),y1:Math.min(rh-2,ty+1),c:['#b91c1c','#1d4ed8','#047857','#7c3aed','#b45309','#be185d','#0f766e'][i%7]};
 const deco=(x,y)=>y===-1?(x%2===1?'win':x===rw-2?'clock':x%4===0?'pic':null):(y%2===1?'win':y===2?'pic':null);
 return{kind:'h',rw,rh,ex,items,sol,npc,rug,deco,title:'🏠 '+HNAME[i],wall:b.wall,accent:b.roof,wood:'#8a6a4a',ftype:'wood',floor:i%2?['#b98a5a','#ad7e50']:['#c9a46e','#bd9862']};}
function buildShop(i){const st=STALLS[i],rw=6,rh=5,ex=3,items=[],sol={};
 const put=(t,x,y)=>{items.push({t,x,y,k:items.length});sol[x+','+y]=1;};
 const disp=st.trader?'crate':'gshelf';
 put(disp,0,0);put(disp,1,0);put(disp,4,0);put(disp,5,0);put('safe',3,0);
 put('counter',1,1);put('register',2,1);put('counter',3,1);
 put(st.trader?'crate':'gshelf',0,2);put(st.trader?'scale':'gtable',0,3);
 put(st.trader?'crate':'gtable',5,2);put('crate',5,3);put('plant',0,4);
 const npc={x:2.5,y:.5,pal:SPAL[i%SPAL.length],line:st.trader?'Rohstoffe gefällig? Ich kaufe und verkaufe!':'Willkommen bei „'+st.n+'“! Komm an den Tresen.'};sol['2,0']=1;
 const deco=(x,y)=>y===-1?(x===0||x===5?'win':x===2||x===3?null:'poster'):(y===1||y===3?'win':y===2?'poster':null);
 return{kind:'s',i,rw,rh,ex,items,sol,npc,rug:null,deco,title:'🏪 '+st.n,wall:'#efe4cf',accent:st.col,wood:shades(st.col)[2],ftype:'tile',floor:['#e2ddd0','#d2ccbd'],shop:true,desk:{x:2.5,y:1.5}};}
function iBlocked(x,y){const rm=roomOf(IN);if(y===rm.rh&&x===rm.ex)return false;if(x<0||y<0||x>=rm.rw||y>=rm.rh)return true;return !!rm.sol[x+','+y];}
function enterRoom(kind,i,ox,oy,msg){const rm=roomOf({kind,i});IN={kind,i,ox,oy};P.x=rm.ex+.5;P.y=rm.rh-.55;P.vx=0;P.vy=-1;cam.init=false;beep(523,.08);beep(659,.1);toast(msg);}
function checkDoors(wy){
 if(IN){const rm=roomOf(IN);if(P.y>=rm.rh){P.x=IN.ox;P.y=IN.oy;P.vx=0;P.vy=1;IN=null;cam.init=false;beep(330,.08);beep(260,.1);}return;}

 if(wy<0&&P.y-ty<.3){const si=stallAt[tx+','+(ty-1)];if(si!==undefined)enterRoom('s',si,tx+.5,ty+.6,'🏪 '+STALLS[si].n);}}
/* Wandflächen: 'L' = Fläche nach +y (Rückwand), 'R' = Fläche nach +x (linke Wand) */
function fpt(sx,sy,side,u,v){const cx=sx,cy=sy+8;return side==='L'?[cx-16+16*u,cy+8*u-v]:[cx+16*u,cy+8-8*u-v];}
function fq(sx,sy,side,u0,u1,v0,v1,col){const a=fpt(sx,sy,side,u0,v0),b=fpt(sx,sy,side,u1,v0),c=fpt(sx,sy,side,u1,v1),d=fpt(sx,sy,side,u0,v1);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(c[0],c[1]);ctx.lineTo(d[0],d[1]);ctx.fill();}
function glassCol(){const f=S.tod/DAY;return f>.85?'#1e3a5f':f>.7?'#f6b26b':'#9fd8f5';}
function faceWindow(sx,sy,s,v0,v1,acc){fq(sx,sy,s,.12,.88,v0-1.5,v0,'#e5e7eb');fq(sx,sy,s,.2,.8,v0,v1,'#f8fafc');fq(sx,sy,s,.26,.74,v0+1.5,v1-1.5,glassCol());
 fq(sx,sy,s,.48,.52,v0+1.5,v1-1.5,'#f8fafc');fq(sx,sy,s,.26,.74,(v0+v1)/2-.5,(v0+v1)/2+.5,'#f8fafc');fq(sx,sy,s,.31,.36,v0+3,v1-3,'rgba(255,255,255,.55)');
 if(acc){fq(sx,sy,s,.06,.2,v0-1,v1+1,acc);fq(sx,sy,s,.8,.94,v0-1,v1+1,acc);fq(sx,sy,s,.06,.94,v1+1,v1+2.5,shades(acc)[2]);}}
function faceDeco(t,sx,sy,s,rm,x,y,time){
 if(t==='win')faceWindow(sx,sy,s,15,29,rm.accent);

   else{R(sx-22,sy-4,3,14,'#5b3a1a');R(sx+20,sy-4,3,14,'#5b3a1a');R(sx-27,sy-20,55,16,'#3b2a1a');R(sx-25,sy-18,51,12,'#6b4a2a');txt('MARKT →',sx+1,sy-8,'#ffd84a',10);}}});});
 cars.forEach(c=>{const sx=(c.x-c.y)*16+ox,sy=(c.x+c.y-1)*8+oy;if(sx<-40||sx>VW+40)return;const q=c.dir;
  L.push({d:c.x+c.y+.5,f:()=>{box(sx-q*6,sy-q*3,.5,5,c.col);box(sx+q*6,sy+q*3,.5,5,c.col);box(sx,sy,.55,4,'#cfe8ff',5);R(sx-q*6-1,sy+10,3,2,'#111');R(sx+q*6-1,sy+16,3,2,'#111');}});});
 for(let x=r.x-1;x<r.x+r.w;x++)L.push({d:x+r.y,f:()=>drawWall(x,r.y-1,(x-(r.y-1))*16+ox,(x+r.y-1)*8+oy)});
 for(let y=r.y;y<r.y+r.h;y++)L.push({d:r.x-1+y,f:()=>drawWall(r.x-1,y,(r.x-1-y)*16+ox,(r.x-1+y)*8+oy)});
 for(const k in trees){const[x,y]=k.split(',').map(Number);const sx=(x-y)*16+ox,sy=(x+y)*8+oy;if(sx<-30||sx>VW+30||sy<-30||sy>VH+40)continue;L.push({d:x+y+1,f:()=>drawTree(sx,sy+8,trees[k])});}
 STALLS.forEach((s,i)=>L.push({d:s.x+s.y+1,f:()=>drawStall(i,(s.x-s.y)*16+ox,(s.x+s.y)*8+oy,time)}));
 for(const k in S.objs){const o=S.objs[k];L.push({d:o.x+o.y+(o.t==='conv'?.5:1),f:()=>drawObj(o,(o.x-o.y)*16+ox,(o.x+o.y)*8+oy,time)});}
 const ch=(e,pal,carry)=>L.push({d:e.x+e.y+.2,f:()=>{const s=w2s(e.x,e.y);drawChar(s.x+ox,s.y+oy+2,e.vx||0,e.vy||1,e.ph||0,e.mv,pal,carry);}});
 ch(P,{shirt:'#ff7a1a',pants:'#2b4a8a',skin:'#f1c27d',hair:'#4a2a12',hat:'#ffd84a',pack:'#7a4a22',stripe:'#e5e7eb'},invCount()||0);
 workers.forEach(w=>ch(w,w.kind==='tech'?{shirt:'#e8a317',pants:'#444',skin:'#d9a066',hair:'#222',hat:'#ff9a1a'}:{shirt:'#3b82d9',pants:'#223',skin:'#f1c27d',hair:'#222',hat:'#3b82d9'},w.carry?w.carry.n:0));
 custs.forEach(cu=>ch(cu,cu.pal,0));
 L.sort((a,b)=>a.d-b.d);L.forEach(i=>i.f());
 garageOverlay(time);
 parts.forEach(p=>R(p.x+ox,p.y+oy,2,2,p.c));
 floats.forEach(f=>{const s=w2s(f.x,f.y);ctx.globalAlpha=Math.min(1,f.t*2);txt(f.txt,s.x+ox,s.y+oy-26,f.c,10);ctx.globalAlpha=1;});
 // Kompass-Pfeil
 const tg=invCount()&&Object.keys(S.inv).some(i=>info(i).k==='broken')?{x:6,y:6}:(invCount()===0?{x:32,y:9}:null);
 if(tg&&!modal){const d=Math.hypot(tg.x-P.x,tg.y-P.y);if(d>7){const a=w2s(tg.x-P.x,tg.y-P.y),m=Math.hypot(a.x,a.y),px=VW/2+a.x/m*34,py=VH/2+a.y/m*17+Math.sin(time*5)*2;
  ctx.fillStyle='#ffd84a';ctx.save();ctx.translate(px,py-4);ctx.rotate(Math.atan2(a.y,a.x));ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.fill();ctx.restore();}}
 // Tageszeit
 const f=S.tod/DAY;if(f>.82){ctx.fillStyle='rgba(20,20,70,'+((f-.82)/.18*.28)+')';ctx.fillRect(0,0,VW,VH);}
 flushText();}
function resize(){PS=innerHeight/VH;VW=Math.ceil(innerWidth/PS);cv.width=VW;cv.height=VH;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';ctx.imageSmoothingEnabled=false;const DPR=window.devicePixelRatio||1;tc.width=Math.round(innerWidth*DPR);tc.height=Math.round(innerHeight*DPR);tc.style.width=innerWidth+'px';tc.style.height=innerHeight+'px';}
addEventListener('resize',resize);resize();

/* ================= START ================= */
let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
try{init(saved?JSON.parse(saved):null);}catch(e){init(null);}
if(!saved)setTimeout(()=>toast('Willkommen! Du hast 50€. Geh zum Schrottmarkt im Osten →'),600);else toast('Spielstand geladen – Tag '+S.day);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
addEventListener('pagehide',save);
let last=performance.now();
function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;try{update(dt);render(t/1000);}catch(e){console.error(e);}requestAnimationFrame(loop);}
hud();requestAnimationFrame(loop);
</script>
